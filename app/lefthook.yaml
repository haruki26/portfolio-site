pre-commit:
  commands:
    check:
      root: app/
      glob: "app/**/*.{ts,tsx,json}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    type-check:
      root: app/
      run: "pnpm ci:type"

    test:
      root: app/
      run: pnpm test
