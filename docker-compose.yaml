services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - mise:/mise

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    stdin_open: true
    tty: true

volumes:
  node_modules:
  mise:
