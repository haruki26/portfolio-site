pre-commit:
  commands:
    check-cms-pack:
      root: packages/cms/
      glob: packages/cms/**/*.ts
      run: pnpm biome check --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    type-check-cms-pack:
      root: packages/cms/
      run: "pnpm ci:type"

    test-cms-pack:
      root: packages/cms/
      run: pnpm test
