pre-commit:
  parallel: true
  commands:
    check-ts:
      root: packages/motion-core/
      glob: packages/motion-core/ts/**/*.ts
      run: pnpm biome check --write {staged_files}
      stage_fixed: true

    check-rs:
      root: packages/motion-core/
      glob: packages/motion-core/src/**/*.rs
      run: rustfmt {staged_files} && cargo clippy
      stage_fixed: true
